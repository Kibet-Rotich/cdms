# Proof-of-concept stack: 3 containers (web, api, db). See docs/03-architecture.md.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cdms
      POSTGRES_USER: cdms
      POSTGRES_PASSWORD: cdms-dev-password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdms -d cdms"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      POSTGRES_DB: cdms
      POSTGRES_USER: cdms
      POSTGRES_PASSWORD: cdms-dev-password
      POSTGRES_HOST: db
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: change-me-for-any-shared-deployment
      INTEROP_MODE: mock
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      VITE_API_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
